spring.application.name=swapwise-backend
spring.config.import=optional:file:.env[.properties]
spring.docker.compose.lifecycle-management=start_only

#### Web ####
spring.threads.virtual.enabled=true
spring.mvc.problemdetails.enabled=true
server.compression.enabled=true
spring.servlet.multipart.enabled=false

#### Logging ####
# Request and response bodies are never logged: they contain receipt lines.
logging.level.root=INFO
logging.level.dev.swapwise=INFO

#### Actuator ####
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.probes.enabled=true
management.metrics.distribution.percentiles-histogram.http.server.requests=true

#### Database ####
spring.datasource.hikari.maximum-pool-size=10
spring.flyway.locations=classpath:db/migration

#### LLM ####
# One OpenAI-compatible client. For local development, point it at Ollama's OpenAI-compatible API instead
# (see .env.example); the key is then ignored.
spring.ai.openai.api-key=${OPENAI_API_KEY}
spring.ai.openai.base-url=${OPENAI_BASE_URL:https://api.openai.com}
spring.ai.openai.chat.model=${OPENAI_MODEL:gpt-5-mini}
spring.ai.model.embedding=none
spring.ai.model.image=none
spring.ai.model.audio.speech=none
spring.ai.model.audio.transcription=none
spring.ai.model.moderation=none

#### Swapwise ####
swapwise.parse.prompt-version=v1
swapwise.parse.timeout=10s
swapwise.parse.per-install-daily-lines=600
swapwise.parse.global-daily-lines=20000
swapwise.app-check.enabled=${APP_CHECK_ENABLED:true}
swapwise.app-check.project-number=${FIREBASE_PROJECT_NUMBER:}
