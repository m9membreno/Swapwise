# Single place for dependency versions. Renovate opens PRs when new versions ship.
[versions]
kotlin = "2.2.21"
spotless = "7.2.1"
ktlint = "1.7.1"

[libraries]

[plugins]
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
spotless = { id = "com.diffplug.spotless", version.ref = "spotless" }
