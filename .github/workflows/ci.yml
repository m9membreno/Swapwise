name: CI

on:
  push:
    branches: ["main", "feat/*", "fix/*"]
    paths-ignore: ["**.md", "docs/**", "LICENSE"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: Core modules (format, tests, coverage)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Check formatting
        run: ./gradlew spotlessCheck

      - name: Test optimizer and domain, verify coverage
        run: ./gradlew :core:optimizer:check :core:domain:check

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: optimizer-test-reports
          path: core/optimizer/build/reports/

  android:
    name: Android (unit tests, debug build, lint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: ./gradlew :core:data:testDebugUnitTest :feature:scan:testDebugUnitTest :feature:swaps:testDebugUnitTest

      - name: Build and lint
        run: ./gradlew :app:assembleDebug :app:lintDebug

      - name: Upload reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-reports
          path: "**/build/reports/"

  backend:
    name: Backend (unit and Testcontainers integration tests)
    runs-on: ubuntu-latest # has Docker, which Testcontainers needs for Postgres
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Test and verify coverage
        run: ./gradlew check

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-reports
          path: backend/build/reports/
